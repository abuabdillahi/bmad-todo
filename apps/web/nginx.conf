# The web tier: serves the SPA and forwards /api/* to the API with the path unchanged (AD-4).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's DNS, re-resolved within 5 s so a restarted api is found again (AD-4).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Security headers (AD-19). Declared here only: any add_header inside a
    # location would stop these being inherited there.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Browsers honour HSTS only over HTTPS (Cloudflare's edge in prod) and ignore it on
    # the plain-HTTP test origin. No includeSubDomains: it covers this hostname only.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # A variable upstream makes nginx resolve "api" at request time. With no
        # URI part, proxy_pass forwards the request URI unchanged.
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bounds how long a request waits on an api that is gone. For up to 5 s
        # after the api container stops, a worker may still hold its old address,
        # and a connect to that address gets no answer at all. On the compose
        # network a live api accepts in well under a millisecond, so 1 s is ample
        # and the browser gets the unavailable problem in about a second, not 5.
        proxy_connect_timeout 1s;
        # Bounds how long a request waits on an api that accepted the connection
        # but never answers (hung, or its container paused: the kernel still
        # completes the handshake). After 10 s nginx gives up with a 504, which
        # the error_page below turns into the unavailable problem. Every API
        # route answers in milliseconds, so 10 s only ever cuts off a stall.
        proxy_read_timeout 10s;

        # When nginx itself can't reach the API (502, 503, 504), answer the
        # unavailable problem instead of an HTML page (AD-4, AD-9). Without
        # proxy_intercept_errors, the API's own problems pass through untouched.
        error_page 502 503 504 = @api_unavailable;
    }

    # AD-4's literal body, byte for byte. The empty `types {}` makes
    # default_type the response's Content-Type.
    location @api_unavailable {
        types {}
        default_type application/problem+json;
        return 503 '{"type":"/problems/unavailable","title":"Service unavailable","status":503,"detail":"The service is unavailable. Try again shortly."}';
    }

    # Vite's build output: content-hashed file names, so a year's cache is safe. A
    # missing asset (an old hash after a deploy) is a 404, never index.html served
    # as JavaScript. `expires` is not add_header, so the headers above still apply.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html (and the SPA fallback) is revalidated on every load (`no-cache`),
    # so a deploy's new asset hashes are picked up at once.
    location / {
        expires epoch;
        try_files $uri $uri/ /index.html;
    }
}
