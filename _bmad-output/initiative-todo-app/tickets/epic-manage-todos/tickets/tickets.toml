# Stories of epic-manage-todos (epic 2), in build order. Sliced 2026-11-25 in the hands-off run on the user's instruction
# (epic Notes hold the split, order and tracer decisions).
# covers = this epic's Requirements ids (numbered as their parent ids, R4 = parent R4, and so on).
# Scenario ids (../../../test-strategy.md) and the parts of shared ones, AD ids, and UX sections are in `references`,
# so a pulled story carries them. Every story ships its own tests in the AD-20 harness (C8).
# Moved in from the backlog by `tickets.py move` (ids 10-13): #33, #30, #29 and #31; their tables are placed in build order by hand.

[[entry]]
id = 1
type = "story"
title = "A resubmitted failed add stores one todo, and a stalled save gives up in time"
description = "Makes AD-13's mutation helper safe before edit, complete and delete build on it (epic-todo-foundation retrospective A3): resubmitting a failed add's unchanged restored text sends the failed add's id again, so AD-6's replay stops a duplicate; nginx answers a stalled API with the unavailable problem after 10 s, and the API client gives up on any write after 15 s with no response; MutationSpec.position is removed; and the e2e specs move onto one set of shared helpers (retrospective A7), which every later e2e story uses."
verify = "On the test profile, pause the api container for 12 s while adding a todo: within about 10 s the card goes and the banner says the add failed because the service is unavailable; unpause, press Add with the restored text unchanged, refresh: exactly one todo with that text is listed."
covers = ["R7", "R12", "R17"]
after = ["1.6", "1.7"]
hitl = false
risk = "high"
refine = true
references = [
  "retrospective — _bmad-output/initiative-todo-app/tickets/epic-todo-foundation/epic-todo-foundation-retrospective.md: findings R1, R2 and R9 (action A3), the duplication map and P2 (action A7)",
  "test strategy — _bmad-output/initiative-todo-app/test-strategy.md: U4 and U5 (a follow-up behind a resubmitted create), K1 (a resubmitted restored add), E6 add part (a stalled API and a lost response revert with a message), E8 for those states",
  "architecture — _bmad-output/initiative-todo-app/architecture-todo-app/architecture-todo-app.md: AD-4 (nginx answers upstream failures, 504 included, with the unavailable problem), AD-6 (POST 200 replay, 409), AD-7 (client-minted id), AD-9 (network, cancellation), AD-13 (the helper), AD-20 (e2e: page.route only); Deferred (a write that fails may have been applied; revisit with a resubmit that reuses the failed id)",
  "ux — _bmad-output/initiative-todo-app/ux-todo-app/EXPERIENCE.md: State Patterns (Add form states: Add failed, Add landed after all; Row states: Landed after all, Add succeeded on 201 or 200 replay)",
]

[[entry]]
id = 2
type = "story"
title = "The API updates and deletes a todo, atomically, with integration and contract tests"
description = "Adds PATCH /api/todos/{id} (description, completed, or both) and DELETE /api/todos/{id} to the contract, openapi.json and the API, with AD-8's strict validation on update, 404 for an unknown id, AD-15's one-statement writes and a storage failure answered as unavailable, as list and create do; delivers I12 and I13 for both routes and re-tags the existing header and log tests that borrow I8, I2, I10 and I7 to I12 and I13. The web stories 3, 4 and 5 call these routes."
verify = "pnpm test:all passes and lists passing tests for I4, I5, I12 and I13 and for the update and delete parts of I8, I9 and I11. With the test profile up, PATCH http://127.0.0.1:8081/api/todos/<id> with {\"completed\":true} answers 200 with the todo completed, DELETE answers 204 and then 404, and a PATCH with {} answers a validation problem."
covers = ["R10", "R11", "R12", "R17", "R20"]
after = ["1.3", "1.7"]
hitl = false
risk = "medium"
references = [
  "test strategy — _bmad-output/initiative-todo-app/test-strategy.md: I4, I5 whole; I8 for update; I9 for every PATCH and DELETE response (200, 204, 400, 404, 503); I11 update half (unknown field, null, wrong type, empty body, control characters); I12 for the new routes and nginx's 503 on them; I13 for update and delete, refused and failed ones included; the re-tag of the existing tests that borrow I8 (security headers) and I2, I10, I7 (no todo text in logs)",
  "architecture — _bmad-output/initiative-todo-app/architecture-todo-app/architecture-todo-app.md: AD-5 (schemas in packages/contract, openapi.json regenerated and committed), AD-6 (PATCH and DELETE rows; 503 documented on every route), AD-8 (server side, on edit), AD-9 (problem types; storage failure is unavailable on the todo routes), AD-10 (service owns existence), AD-12, AD-15 (one statement or one transaction, the persisted row returned), AD-19, AD-20 (contract and contract-unavailable suites, with headers)",
]

