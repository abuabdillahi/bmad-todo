[[entry]]
id = 15
type = "bug"
title = "A re-run scheduled deploy can skip its health check or miss a rollback"
description = "Retrospective A7 (D3, D6, D7): re-running a failed scheduled run reuses attempt 1's CHECKED SHA, so the deploy's guard can take its skip branch after attempt 1 already deployed the tip and go green with no health check; and catch-up-gate reads the current attempt's start, so a rollback that finished between attempts is not seen. Also to decide: whether a rollback by hand must name a SHA on main, and how the catch-up behaves after a long SSH outage (failed scheduled runs pile up for one tip). Touches the deploy job's steps: the user decides."
verify = "A re-run of a failed scheduled run either deploys and health-checks the tip or skips with a notice, and never deploys over a rollback that ran between attempts, shown by the job-graph and catch-up tests; the user's answers on rollback SHAs and SSH outages are dated Decisions in Notes."
after = []
hitl = false
risk = "high"
refine = true
references = ["retrospective — _bmad-output/initiative-todo-app/tickets/epic-manage-todos/epic-manage-todos-retrospective.md: findings D3, D6, D7; Action items A7"]

